server:
  port: 8084
spring:
  application:
    name: exam-file
  servlet:
    multipart:
      max-file-size: 50MB  # 单个文件最大大小
      max-request-size: 200MB  # 单个请求最大大小（包含所有文件）
  datasource:
    url: jdbc:mysql://localhost:3306/wk_knowledge?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5 #连接池初始大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  file-storage: #文件存储配置
    default-platform: local-1 #默认使用的存储平台
    thumbnail-suffix: ".min.jpg" # 缩略图后缀 例如：.min.jpg，.png会生成.min.jpg
    local: # 本地存储平台配置
      - platform: local-1 # 平台标识符
        enable-storage: true  # 启用存储
        enable-access: true # 启用本地访问 线上环境请使用 Nginx 反向代理
        domain: "http://192.168.78.91:10030/" # 修改为新的端口http://localhost:10030/
        base-path: G:\aaa_study_platform\Temp\ # 文件存储位置
        path-patterns: /static/** # 访问路径 开启本地访问后，通过此路径可以访问到上传的文件
  cloud:
    nacos:
      server-addr: 192.168.78.91:8848
      discovery:
        ip: 192.168.78.91

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath*:/com/baymax/exam/file/mapper/xml/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0