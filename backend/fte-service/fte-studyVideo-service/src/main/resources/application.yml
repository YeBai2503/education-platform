server:
  port: 8087
spring:
  application:
    name: exam-video
  servlet:
    multipart:
      max-file-size: 500MB  # 单个文件最大大小
      max-request-size: 1000MB  # 单个请求最大大小（包含所有文件）
      location: G:/aaa_study_platform/Temp/uploads  # 指定文件上传的临时目录，避免使用C盘
  zipkin:
    base-url: http://localhost:9411/ # zipkin server 的请求地址
    discovery-client-enabled: false  # 让 Nacos 把它当成一个 url ，而不要当成服务名
  datasource:
    url: jdbc:mysql://localhost:3306/wk_video?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: "123456"
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5 #连接池初始化大小
      min-idle: 10 #最小空闲连接数
      max-active: 20 #最大连接数
      web-stat-filter:
        exclusions: "*.js,*.gif,*.jpg,*.png,*.css,*.ico,/druid/*" #不统计这些请求数据
      stat-view-servlet: #访问监控网页的登录用户名和密码
        login-username: druid
        login-password: druid
  redis:
    host: localhost # Redis服务器地址
    database: 0 # Redis数据库索引（默认为0）
    port: 6379 # Redis服务器连接端口
    password: "123456" # Redis服务器连接密码（默认为空）
    timeout: 3000ms # 连接超时时间（毫秒）
  cloud:
    nacos:
      server-addr: 192.168.78.91:8848
      discovery:
        ip: 192.168.78.91
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
logging:
  level:
    com.baomidou.mybatisplus.samples: debug
    root: info

# FFmpeg配置
ffmpeg:
  # Windows系统使用绝对路径，例如：C:/ffmpeg/bin/ffprobe.exe
  # Linux/Mac系统可以使用系统PATH中的ffprobe
  ffprobe-path: D:/ffmpeg-7.0.2/bin/ffprobe.exe  # ffprobe可执行文件路径
  ffmpeg-path: D:/ffmpeg-7.0.2/bin/ffmpeg.exe    # ffmpeg可执行文件路径

# 视频配置
video:
  # 视频处理临时目录（用于存放上传的原始视频文件，处理完成后会自动删除）
  temp-dir: G:/aaa_study_platform/Temp/tempVideos  
  # 文件访问域名URL（用于构建完整的视频访问URL）
  domain-url: http://192.168.78.91:10030/